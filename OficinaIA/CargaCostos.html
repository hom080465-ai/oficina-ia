<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Costos de Componentes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; display: flex; gap: 20px; }
        .form-container { background: #2d2d2d; padding: 20px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .table-container { flex-of: 1; background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 100%; }
        h2 { margin-top: 0; color: #ff9800; }
        label { display: block; margin: 10px 0 5px; color: #bbb; }
        select, input, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #444; background: #3c3c3c; color: #fff; box-sizing: border-box; }
        select option { background: #2d2d2d; }
        button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        button:hover { background: #e08600; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #444; text-align: left; }
        th { background-color: #3c3c3c; color: #ff9800; }
        tr:nth-child(even) { background-color: #333; }
        .export-btn { background: #4CAF50; color: white; }
        .export-btn:hover { background: #43a047; }
    </style>
</head>
<body>

    <!-- FORMULARIO DE CARGA -->
    <div class="form-container">
        <h2>Actualizar Costos</h2>
        <form id="costosForm">
            <label for="codigo">Código del Componente:</label>
            <select id="codigo" required>
                <option value="">-- Seleccione un código --</option>
                <option value="FON001">FON001 - Fuente de Alimentacion 350W</option>
                <option value="FON002">FON002 - Fuente de Alimentacion 450W</option>
                <option value="FON003">FON003 - Fuente de Alimentacion 500W</option>
                <option value="FON004">FON004 - Fuente de Alimentacion 650W</option>
                <option value="FON005">FON005 - Fuente de Alimentacion 750W</option>
                <option value="FON006">FON006 - Fuente de Alimentacion 850W</option>
                <option value="GAB001">GAB001 - Gabinete Chapa Negro</option>
                <option value="GAB002">GAB002 - Gabinete Chapa Blanco</option>
                <option value="GAB003">GAB003 - Gabinete Vidrio Templado Negro</option>
                <option value="GAB004">GAB004 - Gabinete Vidrio Templado Blanco</option>
            </select>

            <label for="precio">Nuevo Precio (\$):</label>
            <input type="number" id="precio" step="0.01" placeholder="Ej: 145.50" required>

            <button type="submit">💾 Guardar Costo</button>
        </form>
        
        <button class="export-btn" id="btnExportar">📥 Exportar a SQL Script</button>
    </div>

    <!-- TABLA DE VISUALIZACIÓN EN TIEMPO REAL -->
    <div class="table-container">
        <h2>Historial de Precios Guardados (Base SQL Interna)</h2>
        <table id="tablaHistorial">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Precio</th>
                    <th>Fecha de Registro</th>
                </tr>
            </thead>
            <tbody>
                <!-- Los datos se cargan dinámicamente aquí -->
            </tbody>
        </table>
    </div>

    <script>
        let db;
        // 1. INICIALIZAR LA BASE DE DATOS INTERNA DEL NAVEGADOR
        const request = indexedDB.open("SistemaCostosDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("HistorialCostos")) {
                // Creamos la tabla con una clave auto-incremental (Historial)
                db.createObjectStore("HistorialCostos", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            mostrarHistorial();
        };

        // 2. EVENTO DEL BOTÓN SAVE (GUARDA NUEVA LÍNEA CON FECHA AUTOMÁTICA)
        document.getElementById("costosForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const codigo = document.getElementById("codigo").value;
            const precio = parseFloat(document.getElementById("precio").value);
            
            // Obtener la fecha de hoy automáticamente en formato AAAA-MM-DD
            const hoy = new Date().toISOString().split('T')[0];

            const nuevoRegistro = { codigo, precio, fecha: hoy };

            const transaction = db.transaction(["HistorialCostos"], "readwrite");
            const store = transaction.objectStore("HistorialCostos");
            store.add(nuevoRegistro);

            transaction.oncomplete = function() {
                document.getElementById("precio").value = ""; // Limpiar campo precio
                mostrarHistorial(); // Refrescar la tabla visual
            };
        });

        // 3. FUNCIÓN PARA MOSTRAR LOS DATOS EN LA TABLA WEB
        function mostrarHistorial() {
            const tbody = document.querySelector("#tablaHistorial tbody");
            tbody.innerHTML = "";

            const transaction = db.transaction(["HistorialCostos"], "readonly");
            const store = transaction.objectStore("HistorialCostos");
            const cursorRequest = store.openCursor(null, "prev"); // "prev" para ver lo más nuevo primero

            cursorRequest.onsuccess = function(e) {
                const cursor = e.target.result;
                if (cursor) {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><strong>${cursor.value.codigo}</strong></td>
                        <td>$${cursor.value.precio.toFixed(2)}</td>
                        <td>${cursor.value.fecha}</td>
                    `;
                    tbody.appendChild(row);
                    cursor.continue();
                }
            };
        }

        // 4. BOTÓN EXTRA: EXPORTAR TODO EN UN ARCHIVO .SQL PARA TU SCRIPT ORIGINAL
        document.getElementById("btnExportar").addEventListener("click", function() {
            const transaction = db.transaction(["HistorialCostos"], "readonly");
            const store = transaction.objectStore("HistorialCostos");
            let sqlLines = "-- SCRIPT GENERADO DESDE LA WEB PRIVADA\n";
            
            store.openCursor().onsuccess = function(e) {
                const cursor = e.target.result;
                if (cursor) {
                    sqlLines += `INSERT INTO CostosComponentes (Codigo, Precio, Fecha) VALUES ('${cursor.value.codigo}', ${cursor.value.precio}, '${cursor.value.fecha}');\n`;
                    cursor.continue();
                } else {
                    // Cuando termina de leer todo, descarga el archivo .sql automáticamente
                    const blob = new Blob([sqlLines], { type: "text/sql" });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = "ActualizacionCostos.sql";
                    link.click();
                }
            };
        });
    </script>
</body>
</html>
